name: .NET Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore cs-node-list.sln

      - name: Build
        run: dotnet build cs-node-list.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test cs-node-list.sln --configuration Release --no-build